use_default_settings: true

server:
  secret_key: "${SEARXNG_SECRET_KEY:-CHANGE_ME_SECRET_KEY}"
  limiter: false
  image_proxy: true
  method: GET

ui:
  static_use_hash: true

search:
  safe_search: 0
  default_lang: auto
  formats:
    - html
    - json

general:
  debug: false
  instance_name: "SearXNG"
  privacypolicy_url: false
  donation_url: false
  enable_metrics: true

engine:
  # Enable SearXNG as a search backend — usable by Firecrawl /search API
  # via SEARXNG_ENDPOINT=http://searxng:8080 in firecrawl.env
