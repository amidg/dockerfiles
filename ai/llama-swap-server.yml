healthCheckTimeout: 300

models:
  "qwen3.8-27b":
    cmd: |
      /app/llama-server \
        --model /models/Qwen3.8-27B-IQ4_XS.gguf \
        --mmproj /models/mmproj-F16.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 262144 --parallel 2 --kv-unified \
        --flash-attn on --cache-type-k q5_0 --cache-type-v q4_1 \
        --batch-size 2048 --ubatch-size 1024 \
        --cache-reuse 256 \
        --temp 0.7 --top-k 20 --top-p 0.80 --min-p 0.0 --presence-penalty 1.5
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 0

  "qwen3.8-27b-mtp":
    cmd: |
      /app/llama-server \
        --model /models/Qwen3.8-27B-IQ4_XS.gguf \
        --mmproj /models/mmproj-F16.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 262144 --parallel 1 \
        --flash-attn on --cache-type-k q5_0 --cache-type-v q4_1 \
        --batch-size 2048 --ubatch-size 1024 \
        --cache-reuse 256 \
        --spec-type draft-mtp --spec-draft-n-max 2 \
        --temp 0.7 --top-k 20 --top-p 0.80 --min-p 0.0 --presence-penalty 1.5
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 0
