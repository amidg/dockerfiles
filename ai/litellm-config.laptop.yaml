model_list:
  - model_name: tiel-coder-35b
    litellm_params:
      model: openai/tiel-coder-35b
      api_base: http://strata:8080/v1
      api_key: sk-no-key-required
      allowed_openai_params: ["reasoning_effort"]
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 32768

  - model_name: gemma-4-e2b
    litellm_params:
      model: openai/gemma-4-e2b
      api_base: http://llama_swap_intel:8080/v1
      api_key: sk-no-key-required
    model_info:
      max_input_tokens: 32768
      max_output_tokens: 8192

  - model_name: embeddinggemma-2
    litellm_params:
      model: openai/embeddinggemma-2
      api_base: http://llama_swap_intel:8080/v1
      api_key: sk-no-key-required
    model_info:
      max_input_tokens: 8192
      mode: embedding

  - model_name: qwen3.8-flash-next
    litellm_params:
      model: openai/qwen3.8-flash-next
      api_base: https://api.gusev.tech/v1
      api_key: os.environ/SERVER_API_KEY
      allowed_openai_params: ["reasoning_effort"]
      timeout: 180
      stream_timeout: 180
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768
      cooldown_time: 300
      allowed_fails_policy:
        TimeoutErrorAllowedFails: 0

  - model_name: glm-5.3-flash
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://opencode.ai/inference/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      extra_headers:
        x-opencode-session: litellm-gateway-0001
        User-Agent: litellm-gateway/1.0
        Accept-Encoding: gzip, deflate
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768

  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://opencode.ai/inference/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      extra_headers:
        x-opencode-session: litellm-gateway-0001
        User-Agent: litellm-gateway/1.0
        Accept-Encoding: gzip, deflate
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768

  - model_name: mimo-v2.6-flash
    litellm_params:
      model: openai/mimo-v2.6-flash
      api_base: https://opencode.ai/inference/go/v1
      api_key: os.environ/OPENCODE_GO_API_KEY
      extra_headers:
        x-opencode-session: litellm-gateway-0001
        User-Agent: litellm-gateway/1.0
        Accept-Encoding: gzip, deflate
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768

router_settings:
  retry_after: 15
  fallbacks:
    - qwen3.8-flash-next: ["glm-5.3-flash", "deepseek-v4.1-flash"]
    - tiel-coder-35b: ["deepseek-v4.1-flash"]
    - gemma-4-e2b: ["mimo-v2.6-flash"]
  model_group_retry_policy:
    qwen3.8-flash-next:
      TimeoutErrorRetries: 0

litellm_settings:
  drop_params: true
  num_retries: 3
  log_model_api_calls: true
  log_model_api_calls_to_db: true
  ui_access_controls:
    admin_only: true
  database_type: postgres
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
