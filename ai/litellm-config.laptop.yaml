router_settings:
  model_group_alias:
    local-main: server-qwen38-27b
    local-vision: server-qwen38-27b
    local-tiny: gemma-4-e2b

litellm_settings:
  drop_params: true
  num_retries: 3
  log_model_api_calls: true
  log_model_api_calls_to_db: true
  ui_access_controls:
    admin_only: true
  database_type: postgres
  request_timeout: 600
  fallbacks:
    - local-main: ["qwen3.6-35b", "gemma-4-26b"]
    - local-vision: ["gemma-4-e2b"]
    - local-tiny: ["qwen3.5-2b"]
    - server-qwen38-27b-xhigh: ["qwen3.6-35b", "gemma-4-26b"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
