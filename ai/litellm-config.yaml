# LiteLLM gateway config.
#
# Agents should target the SEMANTIC ALIASES (see model_group_alias at the bottom):
#   local-reasoning  main agent, coding, big prompts  RTX 5070  :8081
#   local-fast       parallel delegation lane         Arc iGPU  :8082
#   local-vision     images, screenshots, PDFs        Arc iGPU  :8082
#   local-tiny       titles, classification, routing  Arc iGPU  :8082
# Raw model names still work, but aliases let the tier behind a role change without
# touching Hermes' agent definitions.
#
# MEASURED throughput (6524-token prompt) — the dGPU wins on raw speed, so
# `local-fast` is NOT "the fastest model", it is "the lane that does not contend
# with the main agent":
#   RTX 5070  qwen3.5-9b   1932 tok/s prefill  48 tok/s decode
#   Arc iGPU  gemma-4-e4b   146 tok/s prefill  10 tok/s decode
# Each llama-swap instance is --parallel 1 and holds ONE model, so concurrent
# delegation agents on local-reasoning serialize behind each other. Routing them to
# local-fast gives Hermes a genuine second lane instead of a queue, and keeps the
# dGPU free for the main agent. Prefer local-reasoning for any single prompt that is
# large or hard; prefer local-fast for breadth.
#
# api_base tells you which physical tier serves a model:
#   llama_swap_intel   Arc iGPU, laptop      (ai/llama-swap-intel.yaml)
#   llama_swap_nvidia  RTX 5070 8GB, laptop  (ai/llama-swap-nvidia.yaml)
#   llama_swap_server  7900 XTX 24GB desktop (ai/llama-swap-config.yaml)
#
model_list:
  # ---- Local: 24GB AMD desktop (llama_swap_server) ----
  # model_name must match a key in llama-swap-config.yaml
  # llama-swap handles all inference params; only routing info needed here
  - model_name: gemma-4-12b
    litellm_params:
      model: openai/gemma-4-12b        # dense 12B, 256K ctx, q8_0 KV (6.7GB)
      api_base: http://llama_swap_server:8080/v1
      api_key: sk-no-key-required

  - model_name: gemma-4-26b
    litellm_params:
      model: openai/gemma-4-26b        # MoE 26B/A4B, 64K ctx (16GB)
      api_base: http://llama_swap_server:8080/v1
      api_key: sk-no-key-required

  - model_name: qwen3.6-27b
    litellm_params:
      model: openai/qwen3.6-27b        # dense 27B, vision, 64K ctx, q8_0 KV (17GB)
      api_base: http://llama_swap_server:8080/v1
      api_key: sk-no-key-required

  - model_name: qwen3.6-35b
    litellm_params:
      model: openai/qwen3.6-35b        # MoE 35B/A3B, vision, 64K ctx, q8_0 KV (17GB)
      api_base: http://llama_swap_server:8080/v1
      api_key: sk-no-key-required

  - model_name: qwen3-coder-30b
    litellm_params:
      model: openai/qwen3-coder-30b    # MoE coder 30B/A3B, 64K ctx (17GB)
      api_base: http://llama_swap_server:8080/v1
      api_key: sk-no-key-required

  # ---- Local: laptop SECONDARY GPU, Arc iGPU (llama_swap_intel, host :8082) ----
  # Vision + small/fast + the second parallel lane. No dedicated VRAM — allocates from
  # 62GB system RAM, so these run bigger batches and q8_0 KV than the 8GB tier below.
  # Both stay resident simultaneously (llama-swap `groups`), so switching between them
  # is ~0.4s rather than a ~20s reload.
  - model_name: gemma-4-e4b
    litellm_params:
      model: openai/gemma-4-e4b        # MoE 4B active, vision, 64K ctx (~5GB)
      api_base: http://llama_swap_intel:8080/v1
      api_key: sk-no-key-required

  - model_name: gemma-4-e2b
    litellm_params:
      model: openai/gemma-4-e2b        # MoE 2B active, vision, 32K ctx (3.0GB)
      api_base: http://llama_swap_intel:8080/v1
      api_key: sk-no-key-required

  # Embeddings for research/RAG. DISABLED until the GGUF is downloaded — uncomment
  # here and in ai/llama-swap-intel.yaml together.
  # - model_name: embed
  #   litellm_params:
  #     model: openai/embed
  #     api_base: http://llama_swap_intel:8080/v1
  #     api_key: sk-no-key-required

  # ---- Local: laptop PRIMARY GPU, RTX 5070 8GB (llama_swap_nvidia, host :8081) ----
  # The fast tier and the default home for agent traffic: 1932 tok/s prefill,
  # 48 tok/s decode. llama-swap unloads it after 10 min idle, since a sustained
  # load here pins 40-60W.
  - model_name: qwen3.5-9b
    litellm_params:
      model: openai/qwen3.5-9b         # dense 9B, 64K ctx, q4_0 KV (6303 of 8151 MiB)
      api_base: http://llama_swap_nvidia:8080/v1
      api_key: sk-no-key-required

  # ---- Intel NPU: NOT ROUTED ----
  # The OpenVINO NPU backend runs at 0.61 tok/s decode (a 24-token tool call took 39s,
  # vs ~7s warm on the iGPU). The container and the intel_npu_llama_cpp
  # profile are kept for experimentation, but no model_list entry points at it and no
  # alias resolves to it. Reach it directly on localhost:8083 if you want to poke at it.
  # See ai/LLAMA-CPP.md for the full measurements.

  # ---- Anthropic ----
  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ---- Google Gemini ----
  - model_name: gemini-3.1-pro
    litellm_params:
      model: gemini/gemini-3.1-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  # Semantic roles for Hermes' main agent and delegation agents. Agents name a ROLE,
  # not a checkpoint, so the model behind a role can be swapped (or moved to another
  # tier) without touching any agent definition.
  model_group_alias:
    local-reasoning: qwen3.5-9b   # RTX 5070  — main agent, coding, any large prompt
    local-fast: gemma-4-e4b       # Arc iGPU  — parallel delegation lane, tool calling
    local-vision: gemma-4-e4b     # Arc iGPU  — images, screenshots, PDFs (only vision tier)
    local-tiny: gemma-4-e2b       # Arc iGPU  — titles, classification, routing
    # local-embed: embed          # Arc iGPU  — enable with the embed model above

litellm_settings:
  drop_params: true
  num_retries: 3                     # workaround: prevents NoneType > int crash in router
  log_model_api_calls: true          # log all API calls
  log_model_api_calls_to_db: true    # log to DB for spend tracking
  ui_access_controls:
    admin_only: true                 # /ui only accessible to admin
  database_type: postgres            # explicit DB type

  # Local inference is slow enough to trip LiteLLM's default timeout: a cold model load
  # plus a vision prefill on the iGPU measured 19.4s end-to-end, which surfaced as
  # "InternalServerError - Connection error" rather than anything diagnostic. Give
  # local tiers room; a 6.5K-token prompt on the iGPU alone costs ~45s.
  request_timeout: 600

  # Degrade instead of erroring when a tier is down or busy. The important one is
  # qwen3.5-9b -> gemma-4-e4b: if the dGPU tier is unavailable (container down, VRAM
  # contention, laptop on battery), reasoning requests fall back to the iGPU rather
  # than failing the agent outright.
  #
  # NOTE: fallbacks are matched against the model group NAME AS REQUESTED. A request
  # for the alias `local-vision` does NOT inherit the fallback declared for
  # `gemma-4-e4b` — it fails with "No fallback model group found for original
  # model_group=local-vision". So the aliases are listed explicitly as well.
  fallbacks:
    - qwen3.5-9b: ["gemma-4-e4b"]
    - gemma-4-e4b: ["gemma-4-e2b"]
    - local-reasoning: ["gemma-4-e4b"]
    - local-fast: ["gemma-4-e2b"]
    - local-vision: ["gemma-4-e2b"]
    - local-tiny: ["gemma-4-e4b"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
