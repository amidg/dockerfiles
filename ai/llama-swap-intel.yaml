healthCheckTimeout: 60

groups:
  igpu:
    swap: false
    exclusive: false
    members:
      - qwen3.5-2b
      - embed

models:
  "qwen3.5-2b":
    cmd: |
      /app/llama-server \
        --model /models/Qwen3.5-2B-UD-Q4_K_XL.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 65536 --parallel 1 \
        --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0 \
        --batch-size 2048 --ubatch-size 1024 \
        --cache-reuse 256 \
        --reasoning off \
        --temp 0.7 --top-k 20 --top-p 0.8 --presence-penalty 0.5
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600

  "embed":
    cmd: |
      /app/llama-server \
        --model /models/Qwen3-Embedding-0.6B-Q8_0.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 8192 --parallel 1 \
        --embedding --pooling last \
        --batch-size 8192 --ubatch-size 8192
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 900
