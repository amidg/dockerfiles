# llama-swap configuration — INTEL ARC iGPU TIER (laptop: ThinkPad T1g Gen 8)
#
# Runs alongside llama-swap-nvidia.yaml on the SAME machine (different container,
# different host port). This instance advertises only models the iGPU should serve;
# see ai/llama-swap-nvidia.yaml for the RTX 5070 tier and ai/llama-swap-config.yaml
# for the 24GB AMD desktop.
#
# TWO llama-server processes, both resident at once:
#   gemma-4-e2b   backs `local-tiny`  — no vision, no reasoning (see below)
#   embed         backs `local-embed` — Qwen3-Embedding 0.6B
#
# `local-tiny` is the ONLY chat alias on this tier. It absorbed the former
# `local-support` alias, which had no consumers and pointed at this same model —
# two names for one thing was just a way to drift out of sync.
#
# ROLE: RAG embeddings plus short, background, fire-and-forget side tasks
# (titles, audio tags, monitor checks, profile/curator writes). Nothing on this tier
# is on the critical path of a user turn, and nothing here needs to see an image or
# think out loud.
#
#   Arc iGPU  gemma-4-e2b    194 tok/s prefill  |  16 tok/s decode
#   RTX 5070  gemma-4-26b    641 tok/s prefill  |  23 tok/s decode  (default)
#   RTX 5070  qwen3.5-9b    1932 tok/s prefill  |  48 tok/s decode  (swap option)
#
# The dGPU wins on prefill by 3-10x, so the main agent, delegation and vision all
# live on llama-swap-nvidia.yaml. What this tier genuinely buys: it serves embeddings
# and cheap background work WITHOUT evicting gemma-4-26b from the 8GB card (which
# holds exactly one model), and it runs concurrently with it.
#
# NO VISION HERE — the --mmproj was deliberately removed. `local-vision` resolves to
# gemma-4-26b on the dGPU, which has its own projector and is a far better vision
# model. Keeping a projector loaded here cost ~1GB to serve nothing. Consequence:
# there is NO vision fallback on this laptop, and litellm-config.laptop.yaml
# deliberately declares no fallback for `local-vision` — a blind model confidently
# describing an image it cannot see is worse than a clean error. gemma-4-e2b IS
# vision-capable if you re-add --mmproj /models/gemma-4-e2b-mmproj-F16.gguf (n_embd
# 1536 — that exact projector, never another size's).
#
# NO REASONING HERE — every model in this stack is a thinking model, which is pure
# waste for this tier's workload. Measured on a realistic title-generation prompt
# (identical three-word answer in every case):
#
#   configuration          completion tokens   reasoning leaked into content?
#   default (thinking on)  302  (~40s)         no, but ~290 tokens wasted
#   --reasoning-budget 0   358                 YES — see trap below
#   --reasoning off        101-111 (~17s)      no
#
# USE --reasoning off, NOT --reasoning-budget 0. The budget flag only suppresses
# thought-tag PARSING: the model still reasons and the trace lands in `content`, so
# titles come back reading "Thinking Process:\n\n1. **Analyze the conversation**".
# That measured WORSE than leaving thinking on. This is a real trap.
#
# Nor can this be done per-request: `reasoning_effort: none` works when sent straight
# to llama-server (108 tokens, zero reasoning) but is SILENTLY DROPPED by LiteLLM's
# `drop_params: true` for openai/-prefixed custom endpoints (310 tokens, full
# reasoning, no warning). It has to be a server flag.
#
# Caveat: --reasoning off removes the reasoning waste, not e2b's chattiness. Given a
# vague prompt it still rambles to the max_tokens cap; given a well-specified one it
# answers in ~101 tokens. Constrain the prompt, not just the flag.
#
# UBATCH TUNING (measured on a 6524-token prefill — the shape of the curve is a
# property of the iGPU, not the model):
#   ubatch  128 (old 8GB-tier value)  104.3 tok/s
#   ubatch  512                       125.6 tok/s
#   ubatch 1024  <- current           145.9 tok/s
#   ubatch 2048                       135.8 tok/s   (overshoots; regresses)
# 1024 is the sweet spot. The old value of 128 was an 8GB CUDA-tier concession that
# bought nothing here, since the Arc iGPU has no dedicated VRAM and allocates from
# 62GB of system RAM. Same reasoning for q8_0 KV instead of q4_0. The ceiling is
# memory bandwidth, not batch size — an 8x ubatch increase bought only ~40%, so do
# not expect more from further tuning.
#
# MEMORY CAVEAT: the Arc iGPU reports free memory tracking host MemFree, NOT
# MemAvailable (see ai/LLAMA-CPP.md). If a model fails to allocate, check `free -h`
# first — dropping caches or closing apps may be the fix rather than lowering ubatch.
# Fallback ladder if allocation genuinely fails: ubatch 1024 -> 512 -> 256, then
# --ctx-size 65536 -> 32768.
#
healthCheckTimeout: 60
#
# Keep both processes resident. The embedding model is tiny and RAG calls interleave
# with title/background calls constantly, so letting them evict each other would add
# a reload to every switch. Combined they are ~2.5GB against 62GB of system RAM.
#   swap: false      -> members stay loaded instead of evicting each other
#   exclusive: false -> loading these does not unload anything else
groups:
  igpu:
    swap: false
    exclusive: false
    members:
      - gemma-4-e2b
      - embed
#
models:
  # Gemma 4 E2B - MoE (2B active), instruction tuned, Q4_K_XL (3.0GB weights).
  # Backs `local-tiny`, the only chat alias on this tier.
  #
  # TEXT-ONLY BY CHOICE (no --mmproj) and NON-THINKING BY CHOICE (--reasoning off).
  # Both are deliberate; see the header before "restoring" either.
  #
  # 64K context because local-tiny is declared at 65536 in ~/.hermes/config.yaml —
  # the runtime window must cover the largest alias pointed at this model, or long
  # sessions truncate mid-flight.
  "gemma-4-e2b":
    cmd: |
      /app/llama-server \
        --model /models/gemma-4-E2B-it-UD-Q4_K_XL.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 65536 --parallel 1 \
        --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0 \
        --batch-size 2048 --ubatch-size 1024 \
        --cache-reuse 256 \
        --reasoning off \
        --temp 1.0 --top-k 64 --top-p 0.95
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600
#
  # Qwen3-Embedding 0.6B - Q8_0 (610MB), 1024-dim embeddings, 28 layers.
  # Backs `local-embed` for research/RAG (qdrant already runs in ai/n8n.yml).
  # Embedding work is prefill-only and stateless, which is exactly the shape the
  # iGPU handles well — and it keeps RAG traffic off the primary GPU entirely.
  #
  # --pooling last, NOT mean. The GGUF declares pooling_type=3 (LAST), because
  # Qwen3-Embedding derives the sentence vector from the final token rather than
  # averaging. Passing `mean` here would silently produce degraded embeddings that
  # still look plausible — no error, just worse retrieval. llama.cpp would use the
  # model default if --pooling were omitted; it is stated explicitly so nobody
  # "fixes" it to mean later. Sanity check after any change: related pairs must
  # separate from unrelated ones (cat~kitten 0.673, db~sql 0.809, cat~db 0.308).
  #
  # --ubatch-size must be >= the longest input: with pooling enabled the whole
  # sequence has to fit in a single ubatch, so ubatch is pinned to ctx. 8192 covers
  # any realistic RAG chunk (typically 512-1024) without sizing the compute buffer
  # for the model's full 32768 native window.
  #
  # This server is EMBEDDINGS ONLY — it cannot serve /v1/chat/completions.
  "embed":
    cmd: |
      /app/llama-server \
        --model /models/Qwen3-Embedding-0.6B-Q8_0.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 8192 --parallel 1 \
        --embedding --pooling last \
        --batch-size 8192 --ubatch-size 8192
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 900
#
# Flag notes (see ai/llama-swap-config.yaml for the full rationale):
# - --flash-attn on: explicit value required by this llama-server build
# - --cache-type-k/v q8_0: iGPU draws from 62GB system RAM, so no need for the q4_0 hit
# - --batch-size / --ubatch-size: the prefill throughput lever
# - --cache-reuse 256: KV-shift prefix reuse for multi-turn / agentic loops
# - --reasoning off: server-level; cannot be done per-request through LiteLLM
# - --jinja: already ENABLED BY DEFAULT in this build — needed for tool calling, don't add
# - ttl: seconds idle before unloading
#
# This instance runs concurrently with the nvidia one, so an iGPU request never
# evicts gemma-4-26b from the dGPU and vice versa: three models loaded across two
# devices (gemma-4-e2b + embed here, gemma-4-26b there), zero eviction.
