healthCheckTimeout: 60

groups:
  igpu:
    swap: false
    exclusive: false
    members:
      - gemma-4-e2b
      - embeddinggemma-2

models:
  "gemma-4-e2b":
    cmd: |
      /app/llama-server \
        --model /models/gemma-4-E2B-it-Q4_K_M.gguf \
        --mmproj /models/gemma-4-e2b-mmproj-F16.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 65536 --parallel 1 \
        --flash-attn on --cache-type-k f16 --cache-type-v f16 \
        --batch-size 2048 --ubatch-size 2048 \
        --cache-reuse 256 \
        --reasoning off \
        --temp 0.7 --top-k 20 --top-p 0.8 --presence-penalty 0.5
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600

  "embeddinggemma-2":
    cmd: |
      /app/llama-server \
        --model /models/embeddinggemma-2-Q8_0.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 8192 --parallel 1 \
        --embeddings --pooling mean \
        --batch-size 8192 --ubatch-size 8192
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600

