model_list:
  - model_name: qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://llama_swap_server:8080/v1
      api_key: sk-no-key-required
    model_info:
      max_input_tokens: 131072
      max_output_tokens: 131072

router_settings:
  model_group_alias:
    server-qwen38-27b: qwen3.8-27b

litellm_settings:
  drop_params: true
  num_retries: 3
  log_model_api_calls: true
  log_model_api_calls_to_db: true
  ui_access_controls:
    admin_only: true
  database_type: postgres
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
