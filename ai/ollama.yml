services:
  base_ollama: &base_ollama
    profiles:
      - null_profile
    volumes:
      - ollama:/root/.ollama
    networks:
      - open-webui-network
    ports:
      - 11434:11434

  amd_ollama:
    <<: [*base_ollama]
    profiles:
      - amd_ollama
      - amd_ollama_server
    extends:
      file: ../base.yml
      service: base_amdgpu
    image: docker.io/ollama/ollama:rocm
    container_name: ollama_server
    environment:
      - no_proxy=localhost,127.0.0.1
      - OLLAMA_HOST=0.0.0.0

  intel_ollama:
    <<: [*base_ollama]
    profiles:
      - intel_ollama
      - intel_ollama_server
    extends:
      file: ../base.yml
      service: base_mesa_gpu
    image: intelanalytics/ipex-llm-inference-cpp-xpu:latest
    container_name: ollama_server
    environment:
      - no_proxy=localhost,127.0.0.1
      - OLLAMA_HOST=0.0.0.0
      - DEVICE=Arc
      - OLLAMA_INTEL_GPU=true
      - OLLAMA_NUM_GPU=999
      - ZES_ENABLE_SYSMAN=1
    command: sh -c 'mkdir -p /llm/ollama && cd /llm/ollama && init-ollama && exec ./ollama serve'

  nvidia_ollama:
    <<: [*base_ollama]
    profiles:
      - nvidia_ollama
      - nvidia_ollama_server
    extends:
      file: ../base.yml
      service: base_nvidia
    image: ollama/ollama:latest
    container_name: ollama_server
    environment:
      - no_proxy=localhost,127.0.0.1
      - OLLAMA_HOST=0.0.0.0

  open-webui:
    profiles:
      - webui
      - intel_ollama
      - amd_ollama
      - nvidia_ollama
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - OLLAMA_BASE_URL=http://ollama_server:11434
    volumes:
      - open-webui:/app/backend/data
    networks:
      - open-webui-network
    ports:
      - 8080:8080

volumes:
  ollama:
    name: ollama
  open-webui:
    name: open-webui

networks:
  open-webui-network:
    driver: bridge
