# llama-swap configuration
# Models are hot-swappable: llama-swap spawns/kills llama-server processes
# on demand based on which model is requested via OpenAI /v1 API.
#
# Place GGUF model files in ~/.llama/models (created automatically on first run)
# Example: mkdir -p ~/.llama/models && cp your-model.gguf ~/.llama/models/

healthCheckTimeout: 60

models:
  #############################################################################
  # BIG MODELS — 24GB VRAM, 64K context
  #############################################################################

  # Gemma 4 12B - instruction tuned, Q4_K_M (6.7GB)
  "gemma-4-12b":
    cmd: |
      /app/llama-server \
        --model /models/gemma-4-12b-it-Q4_K_M.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 65536 --parallel 1 \
        --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600

  # Gemma 4 26B - instruction tuned, MoE (A4B), Q4_K_M (16GB)
  # 8GB headroom for KV cache at 64K → parallel 1, q8_0 KV cache
  "gemma-4-26b":
    cmd: |
      /app/llama-server \
        --model /models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 65536 --parallel 1 \
        --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  # Qwen 3 Coder 30B - MoE (A3B), instruction tuned, Q4_K_XL (17GB)
  # 7GB headroom for KV cache at 64K → parallel 1, q8_0 KV cache
  "qwen3-coder-30b":
    cmd: |
      /app/llama-server \
        --model /models/Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 65536 --parallel 1 \
        --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  #############################################################################
  # SMALL MODELS — 8GB VRAM, 64K context
  #############################################################################

  # Qwen 3.5 9B - instruction tuned, Q4_K_XL (5.6GB)
  # 2.4GB headroom on 8GB → parallel 1, q4_0 KV cache, reduced batch sizes
  "qwen3.5-9b":
    cmd: |
      /app/llama-server \
        --model /models/Qwen3.5-9B-UD-Q4_K_XL.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 65536 --parallel 1 \
        --flash-attn on --cache-type-k q4_0 --cache-type-v q4_0 \
        --batch-size 384 --ubatch-size 192
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600

  # Gemma 4 E4B - Expert MoE (4B active), instruction tuned, Q4_K_XL (~5GB)
  # 3GB headroom on 8GB → parallel 1, q4_0 KV cache, reduced batch sizes
  "gemma-4-e4b":
    cmd: |
      /app/llama-server \
        --model /models/gemma-4-E4B-it-UD-Q4_K_XL.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 65536 --parallel 1 \
        --flash-attn on --cache-type-k q4_0 --cache-type-v q4_0 \
        --batch-size 256 --ubatch-size 128
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600

  # Gemma 4 E2B - Expert MoE (2B active), instruction tuned, Q4_K_XL (3.0GB)
  # 5GB headroom on 8GB → parallel 1, q4_0 KV cache, moderate batch sizes
  "gemma-4-e2b":
    cmd: |
      /app/llama-server \
        --model /models/gemma-4-E2B-it-UD-Q4_K_XL.gguf \
        --host 127.0.0.1 --port ${PORT} \
        --n-gpu-layers 99 --ctx-size 65536 --parallel 1 \
        --flash-attn on --cache-type-k q4_0 --cache-type-v q4_0 \
        --batch-size 512 --ubatch-size 256
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600

# Flag notes:
# - --flash-attn on: explicit value required by this llama-server build
# - --cache-type-k/v q8_0: higher quality KV cache for 24GB models
# - --cache-type-k/v q4_0: VRAM-saving KV cache for 8GB models
# - --n-gpu-layers 99: offload all layers to GPU
# - ${PORT}: auto-substituted by llama-swap per model subprocess
# - ttl: seconds idle before unloading (0 = never unload)
#
# All models use parallel=1 so --ctx-size is the full per-request context window.
# VRAM (weights + q8_0/q4_0 KV @ 64K):
#   24GB: gemma-4-12b 6.7GB | gemma-4-26b 16GB | qwen3-coder-30b 17GB
#   8GB:  qwen3.5-9b 5.6GB | gemma-4-e4b ~5GB | gemma-4-e2b 3GB
