# llama-swap configuration
# Models are hot-swappable: llama-swap spawns/kills llama-server processes
# on demand based on which model is requested via OpenAI /v1 API.
#
# Place GGUF model files in ~/.llama/models (created automatically on first run)
# Example: mkdir -p ~/.llama/models && cp your-model.gguf ~/.llama/models/

healthCheckTimeout: 60

models:
  # Gemma 4 12B - instruction tuned, Q4_K_M (6.7GB)
  # Fast model, good for quick responses and testing
  "gemma-4-12b":
    cmd: >
      /app/llama-server
      --model /models/gemma-4-12b-it-Q4_K_M.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 --ctx-size 8192 --parallel 2
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600        # unload after 10 min idle

  # Gemma 4 26B - instruction tuned, Q4_K_M (16GB)
  # Larger model, better quality but slower and uses more VRAM
  "gemma-4-26b":
    cmd: >
      /app/llama-server
      --model /models/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99 --ctx-size 4096 --parallel 1
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300        # shorter idle timeout to free VRAM

# Key points:
# - ${PORT} is auto-substituted by llama-swap for each model's subprocess
# - -ngl 99 offloads all layers to GPU (change to 30-40 if VRAM is tight)
# - --ctx-size controls max context length (higher = more VRAM)
# - --parallel controls concurrent requests (1 = sequential, 2+ = parallel)
# - ttl: 0 keeps model loaded; ttl: N unloads after N seconds idle
