# llama.cpp + llama-swap inference stack with LiteLLM gateway
# Usage: podman-compose -f ai/llama-cpp.yml --profile <gpu>_llama_cpp up -d
# where <gpu> is: amd, intel, or nvidia
#
# Services:
#  - llama-swap: local GGUF models via hot-swapping
#  - litellm: OpenAI-compatible gateway (routes to local + cloud providers)
#  - open-webui: web UI (points to LiteLLM)
#  - postgres: tracks LiteLLM spending and virtual key management
#
# Agents point to http://litellm:4000/v1 with LITELLM_MASTER_KEY and pick a model_name.
# Admin UI: http://localhost:4000/ui (login with master key)
# Config: ai/litellm-config.yaml | Secrets: ai/litellm.env | DB: postgres://litellm:5432/litellm
#
# TODO:
# - Add health checks for all services

services:
  #########################
  # DATABASE
  #########################
  # Postgres for LiteLLM spend tracking and virtual keys
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: litellm_postgres
    restart: unless-stopped
    networks:
      - llama-swap-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-litellm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-litellm}
      - POSTGRES_DB=${POSTGRES_DB:-litellm}
    volumes:
      - litellm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}']
      interval: 5s
      timeout: 5s
      retries: 10

  #########################
  # BASE SERVICES
  #########################
  # base llama-swap service
  base_llama_swap: &base_llama_swap
    profiles:
      - null_profile
    volumes:
      - ${HOME}/.llama/models:/models:z
      - ./llama-swap-config.yaml:/app/config.yaml:z,ro
    networks:
      - llama-swap-network
    ports:
      - 8081:8080
    environment:
      - no_proxy=localhost,127.0.0.1
    command: /app/llama-swap -config /app/config.yaml -listen 0.0.0.0:8080

  #########################
  # LLAMA-SWAP SERVICES
  #########################
  # amd llama-swap server
  amd_llama_swap:
    <<: [*base_llama_swap]
    profiles:
      - amd_llama_cpp
      - amd_llama_cpp_server
    extends:
      file: ../base.yml
      service: base_amdgpu
    image: ghcr.io/mostlygeek/llama-swap:rocm
    container_name: llama_swap_server
    environment:
      - no_proxy=localhost,127.0.0.1
      # - HSA_OVERRIDE_GFX_VERSION=11.0.0  # uncomment for specific AMD GPU

  # intel llama-swap server (Vulkan backend)
  intel_llama_swap:
    <<: [*base_llama_swap]
    profiles:
      - intel_llama_cpp
      - intel_llama_cpp_server
    extends:
      file: ../base.yml
      service: base_mesa_gpu
    image: ghcr.io/mostlygeek/llama-swap:vulkan
    container_name: llama_swap_server
    environment:
      - no_proxy=localhost,127.0.0.1
      # - GGML_VULKAN_DEVICE=0  # uncomment to select specific GPU device

  # nvidia llama-swap server
  nvidia_llama_swap:
    <<: [*base_llama_swap]
    profiles:
      - nvidia_llama_cpp
      - nvidia_llama_cpp_server
    extends:
      file: ../base.yml
      service: base_nvidia
    image: ghcr.io/mostlygeek/llama-swap:cuda
    container_name: llama_swap_server
    environment:
      - no_proxy=localhost,127.0.0.1

  # LiteLLM gateway: one OpenAI-compatible endpoint -> local + cloud models
  litellm:
    profiles:
      - litellm
      - intel_llama_cpp
      - amd_llama_cpp
      - nvidia_llama_cpp
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:z,ro
    env_file:
      - path: ./litellm.env
        required: true
    environment:
      - no_proxy=localhost,127.0.0.1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@postgres:5432/${POSTGRES_DB:-litellm}
    networks:
      - llama-swap-network
    ports:
      - 127.0.0.1:4000:4000
      - 192.168.122.1:4000:4000  # libvirt NAT
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]

  # open web-ui frontend (routes through LiteLLM)
  open-webui:
    profiles:
      - webui
      - intel_llama_cpp
      - amd_llama_cpp
      - nvidia_llama_cpp
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    env_file:
      - path: ./litellm.env
        required: true
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - ENABLE_OLLAMA_API=false
      # OPENAI_API_KEY is loaded from litellm.env (must equal LITELLM_MASTER_KEY)
    volumes:
      - open-webui:/app/backend/data
    networks:
      - llama-swap-network
    ports:
      - 8080:8080

volumes:
  open-webui:
    name: open-webui
  litellm_postgres:
    name: litellm_postgres

networks:
  llama-swap-network:
    driver: bridge
