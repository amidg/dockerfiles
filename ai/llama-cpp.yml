services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: litellm_postgres
    restart: unless-stopped
    networks:
      - llama-swap-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-litellm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-litellm}
      - POSTGRES_DB=${POSTGRES_DB:-litellm}
    volumes:
      - litellm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}']
      interval: 5s
      timeout: 5s
      retries: 10

  base_llama_swap: &base_llama_swap
    profiles:
      - null_profile
    volumes:
      - ${LLAMA_MODELS_DIR:-${HOME}/.llama/models}:/models:z
    networks:
      - llama-swap-network
    environment:
      - no_proxy=localhost,127.0.0.1
    command: /app/llama-swap -config /app/config.yaml -listen 0.0.0.0:8080

  nvidia_llama_swap:
    <<: [*base_llama_swap]
    profiles:
      - nvidia_llama_cpp
      - nvidia_llama_cpp_server
    extends:
      file: ../base.yml
      service: base_nvidia
    image: ghcr.io/mostlygeek/llama-swap:cuda
    container_name: llama_swap_nvidia
    volumes:
      - ${LLAMA_MODELS_DIR:-${HOME}/.llama/models}:/models:z
      - ./llama-swap-nvidia.yaml:/app/config.yaml:z,ro
    ports:
      - 8081:8080
    environment:
      - no_proxy=localhost,127.0.0.1

  intel_llama_swap:
    <<: [*base_llama_swap]
    profiles:
      - intel_llama_cpp
      - intel_llama_cpp_server
      - laptop
    extends:
      file: ../base.yml
      service: base_igpu
    image: ghcr.io/mostlygeek/llama-swap:intel
    container_name: llama_swap_intel
    volumes:
      - ${LLAMA_MODELS_DIR:-${HOME}/.llama/models}:/models:z
      - ./llama-swap-intel.yaml:/app/config.yaml:z,ro
      - intel_sycl_cache:/root/.cache
    ports:
      - 8082:8080
    environment:
      - no_proxy=localhost,127.0.0.1
      - ZES_ENABLE_SYSMAN=1

# server_home and server_work are mutually exclusive: both own container "strata" and port 8080.
# Switch with ai/server_start.sh home|work.

  strata:
    profiles:
      - server_home
    extends:
      file: ../base.yml
      service: base_nvidia
    build:
      context: ./Strata
      args:
        CUDA_ARCHITECTURES: 120
    image: localhost/strata:0.1.45
    container_name: strata
    restart: unless-stopped
    networks:
      - llama-swap-network
    volumes:
      - ${LLAMA_MODELS_DIR:-${HOME}/.llama/models}:/models:z
      - ${STRATA_DATA_DIR:-/var/mnt/data/llama/strata}:/data:z
    ports:
      - 8080:8080
    ulimits:
      memlock: -1
    stop_grace_period: 90s
    environment:
      - no_proxy=localhost,127.0.0.1
      - MODEL=IQ2_XS
      - FAMILY=swift
      - CONTEXT=262144
      - VISION=cpu
      - KV=k8v4
      - GGUF_DIR=/models
      - STRATA_ARENA_PIN_GIB=40
      - STRATA_ALLOWED_HOSTS=strata
      - REINSTALL=${STRATA_REINSTALL:-0}

  strata_hip:
    profiles:
      - server_work
    extends:
      file: ../base.yml
      service: base_amdgpu
    build:
      context: ./Strata
      dockerfile: ../strata-hip.Dockerfile
      args:
        HIP_ARCHITECTURES: gfx1100
    image: localhost/strata-hip:0.1.45
    container_name: strata
    restart: unless-stopped
    networks:
      - llama-swap-network
    volumes:
      - ${LLAMA_MODELS_DIR:-${HOME}/.llama/models}:/models:z
      - ${STRATA_WORK_DATA_DIR:-/var/mnt/data/llama/strata-hip}:/data:z
    ports:
      - 8080:8080
    ipc: host
    ulimits:
      memlock: -1
    stop_grace_period: 90s
    environment:
      - no_proxy=localhost,127.0.0.1
      - MODEL=IQ2_XS
      - FAMILY=swift
      - CONTEXT=262144
      - VISION=cpu
      - KV=k8v4
      - GGUF_DIR=/models
      - STRATA_ARENA_PIN_GIB=40
      - STRATA_ALLOWED_HOSTS=strata
      - VRAM_RESERVE_MIB=4096
      - REINSTALL=${STRATA_REINSTALL:-0}

  strata_laptop:
    profiles:
      - laptop
    extends:
      file: ../base.yml
      service: base_nvidia
    build:
      context: ./PolyStrata
      dockerfile: ../polystrata.Dockerfile
      args:
        CUDA_ARCHITECTURES: 120
    image: localhost/strata-poly:0.1.45-poly.1
    container_name: strata
    restart: unless-stopped
    networks:
      - llama-swap-network
    volumes:
      - ${LLAMA_MODELS_DIR:-${HOME}/.llama/models}:/models:z
      - ${STRATA_DATA_DIR:-/var/mnt/data/llama/strata}:/data:z
    ports:
      - 8080:8080
    ulimits:
      memlock: -1
    stop_grace_period: 90s
    environment:
      - no_proxy=localhost,127.0.0.1
      - FAMILY=tiel
      - MODEL=UD-Q3_K_XL
      - CONTEXT=131072
      - VISION=cpu
      - GGUF_DIR=/models
      - STRATA_ALLOWED_HOSTS=strata
      - REINSTALL=${STRATA_REINSTALL:-0}

  base_litellm: &base_litellm
    profiles:
      - null_profile
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    env_file:
      - path: ./litellm.env
        required: true
    environment:
      - no_proxy=localhost,127.0.0.1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@postgres:5432/${POSTGRES_DB:-litellm}
    networks:
      - llama-swap-network
    ports:
      - 127.0.0.1:4000:4000
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000"]

  litellm:
    <<: *base_litellm
    profiles:
      - litellm
      - intel_llama_cpp
      - nvidia_llama_cpp
      - intel_npu_llama_cpp
      - laptop
    volumes:
      - ./litellm-config.laptop.yaml:/app/config.yaml:z,ro

  litellm_server:
    <<: *base_litellm
    container_name: litellm_server
    profiles:
      - server_home
      - server_work
    volumes:
      - ./litellm-config.desktop.yaml:/app/config.yaml:z,ro
    ports:
      - 4000:4000

volumes:
  litellm_postgres:
    name: litellm_postgres
  intel_sycl_cache:
    name: intel_sycl_cache

networks:
  llama-swap-network:
    driver: bridge
