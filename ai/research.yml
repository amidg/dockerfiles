services:
  local-deep-research:
    image: localdeepresearch/local-deep-research
    networks:
      - ldr-network
    ports:
      - 5000:5000
    environment:
      - LDR_WEB_HOST=0.0.0.0
      - LDR_WEB_PORT=5000
      - LDR_DATA_DIR=/data
      - LDR_LLM_OLLAMA_URL=http://192.168.0.171:11434
      - LDR_LLM_PROVIDER=ollama
      - LDR_LLM_MODEL=gemma3:27b
    volumes:
      - ldr_data:/data
      - ldr_scripts:/scripts
      - local_collections:/local_collections
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_started

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    networks:
      - ldr-network
    volumes:
      - searxng_data:/etc/searxng
    restart: unless-stopped

volumes:
  ldr_data:
  ldr_scripts:
  local_collections:
  searxng_data:

networks:
  ldr-network:
